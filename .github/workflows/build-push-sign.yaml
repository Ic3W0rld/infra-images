name: Build, Push & Sign

on:
  push:
    branches: [main]
    paths:
      - "images/**"
  pull_request:
    branches: [main]
    paths:
      - "images/**"
  workflow_dispatch:
    inputs:
      image:
        description: "Image name (directory under images/)"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write  # required for keyless Cosign signing

env:
  REGISTRY: ghcr.io
  OWNER: ic3w0rld

jobs:
  detect-images:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed images
        id: set-matrix
        run: |
          if [ -n "${{ github.event.inputs.image }}" ]; then
            echo "matrix={\"image\":[\"${{ github.event.inputs.image }}\"]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi

          changed=$(git diff --name-only "$BASE" HEAD -- images/ \
            | grep -oP 'images/\K[^/]+' \
            | sort -u \
            | jq -R . | jq -sc .)

          if [ "$changed" = "[]" ]; then
            changed=$(ls images/ | jq -R . | jq -sc .)
          fi

          echo "matrix={\"image\":$changed}" >> "$GITHUB_OUTPUT"

  build-push-sign:
    needs: detect-images
    runs-on: ubuntu-latest
    if: ${{ needs.detect-images.outputs.matrix != '{"image":[]}' }}
    strategy:
      matrix: ${{ fromJson(needs.detect-images.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, Sigstore)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
