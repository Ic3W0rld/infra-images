name: Mirror images to GHCR

on:
  push:
    branches: [main]
    paths:
      - mirrors.yaml
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      name_filter:
        description: "Mirror only images whose name matches this substring (empty = all)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

env:
  GHCR: ghcr.io
  OWNER: ic3w0rld
  ARCH: amd64
  OS: linux

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          YQ_VERSION=4.44.3
          curl -sSL "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64" \
            -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | skopeo login "${{ env.GHCR }}" \
                -u "${{ github.actor }}" \
                --password-stdin

      - name: Mirror images and build lock file
        id: mirror
        env:
          NAME_FILTER: ${{ github.event.inputs.name_filter }}
        run: |
          set -euo pipefail

          LOCK_FILE="mirrors.lock.yaml"
          TMP_LOCK=$(mktemp)

          echo "# AUTO-GENERATED by mirror workflow - do not edit by hand." > "$TMP_LOCK"
          echo "# Re-run the Mirror workflow to refresh." >> "$TMP_LOCK"
          echo "images:" >> "$TMP_LOCK"

          count=0
          errors=0

          while IFS= read -r idx; do
            name=$(yq ".images[$idx].name" mirrors.yaml)
            source=$(yq ".images[$idx].source" mirrors.yaml)
            tag=$(yq ".images[$idx].tag" mirrors.yaml)
            resolve=$(yq ".images[$idx].resolve_latest // \"false\"" mirrors.yaml)

            if [[ -n "$NAME_FILTER" && "$name" != *"$NAME_FILTER"* ]]; then
              continue
            fi

            src="docker://${source}:${tag}"
            dst_base="${{ env.GHCR }}/${{ env.OWNER }}/${name}"

            echo "::group::${name}"
            echo "  src : ${source}:${tag}"
            echo "  arch: ${{ env.ARCH }}"

            resolved_tag="$tag"

            # Resolve latest -> semver by inspecting OCI version label
            if [[ "$resolve" == "true" ]]; then
              version=$(skopeo inspect \
                --override-arch "${{ env.ARCH }}" \
                --override-os   "${{ env.OS }}" \
                "$src" 2>/dev/null \
                | jq -r '.Labels["org.opencontainers.image.version"] // empty' || true)

              if [[ -n "$version" && "$version" != "$tag" ]]; then
                echo "  resolved: $tag -> $version"
                resolved_tag="$version"
              else
                echo "  resolve_latest: no version label found (keeping: $tag)"
              fi
            fi

            # Copy with original tag
            echo "  dst : docker://${dst_base}:${tag}"
            if skopeo copy \
                --override-arch "${{ env.ARCH }}" \
                --override-os   "${{ env.OS }}" \
                "$src" \
                "docker://${dst_base}:${tag}"; then
              echo "  ok  : ${tag}"
              count=$((count + 1))
            else
              echo "  FAILED"
              errors=$((errors + 1))
              echo "::endgroup::"
              continue
            fi

            # Also copy with resolved semver tag if different from original
            if [[ "$resolved_tag" != "$tag" ]]; then
              echo "  dst : docker://${dst_base}:${resolved_tag}"
              if skopeo copy \
                  --override-arch "${{ env.ARCH }}" \
                  --override-os   "${{ env.OS }}" \
                  "$src" \
                  "docker://${dst_base}:${resolved_tag}"; then
                echo "  ok  : ${resolved_tag}"
              else
                echo "  FAILED to push resolved tag ${resolved_tag}"
              fi
            fi

            # Append entry to lock file (no heredoc to avoid YAML indent issues)
            {
              echo "  - name: ${name}"
              echo "    source: ${source}"
              echo "    upstream_tag: ${tag}"
              echo "    ghcr: ${dst_base}"
              echo "    resolved_tag: ${resolved_tag}"
            } >> "$TMP_LOCK"

            echo "::endgroup::"
          done < <(yq '.images | to_entries | .[].key' mirrors.yaml)

          mv "$TMP_LOCK" "$LOCK_FILE"

          echo "mirrored=$count" >> "$GITHUB_OUTPUT"
          echo "errors=$errors" >> "$GITHUB_OUTPUT"

          echo "Mirrored: $count  Errors: $errors"

          if [[ $errors -gt 0 ]]; then
            echo "::warning::$errors image(s) failed to mirror"
          fi

      - name: Commit updated lock file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mirrors.lock.yaml
          if git diff --cached --quiet; then
            echo "No changes to mirrors.lock.yaml"
          else
            git commit -m "chore: update mirrors.lock.yaml [skip ci]"
            git push
          fi

      - name: Job summary
        run: |
          echo "### Mirror run complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stat | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Arch     | ${{ env.ARCH }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mirrored | ${{ steps.mirror.outputs.mirrored }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Errors   | ${{ steps.mirror.outputs.errors }}   |" >> "$GITHUB_STEP_SUMMARY"
