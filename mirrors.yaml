  - name: minio
    source: quay.io/minio/minio
    tag: RELEASE.2024-12-18T13-15-44Z

  - name: minio-mc
    source: quay.io/minio/mc
    tag: RELEASE.2024-11-21T17-21-54Z

  # ── OpenTelemetry Operator (0.126.0) ──────────────────────────────────────

  - name: opentelemetry-operator
