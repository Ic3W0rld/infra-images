# mirrors.yaml — source of truth for all container images mirrored to GHCR.
#
# Fields:
#   name         short slug used as the GHCR image name: ghcr.io/ic3w0rld/<name>
#   source       upstream image reference (registry/repo:tag)
#   tag          upstream tag to mirror; may be "latest" or a RELEASE date
#   resolve_latest  true → also inspect the image for its semver label and push
#                   a second tag; the resolved tag is written to mirrors.lock.yaml
#
# Convention: in Helm values files always reference the resolved semver tag, never "latest".

images:

  # ── ArgoCD ────────────────────────────────────────────────────────────────

  - name: argocd
    source: quay.io/argoproj/argocd
    tag: v2.14.5

  - name: argocd-extension-installer
    source: quay.io/argoprojlabs/argocd-extension-installer
    tag: v0.0.8

  # ── Dex ───────────────────────────────────────────────────────────────────

  - name: dex
    source: ghcr.io/dexidp/dex
    tag: v2.42.0

  # ── Cert-manager (v1.17.1) ────────────────────────────────────────────────

  - name: cert-manager-controller
    source: quay.io/jetstack/cert-manager-controller
    tag: v1.17.1

  - name: cert-manager-webhook
    source: quay.io/jetstack/cert-manager-webhook
    tag: v1.17.1

  - name: cert-manager-cainjector
    source: quay.io/jetstack/cert-manager-cainjector
    tag: v1.17.1

  - name: cert-manager-acmesolver
    source: quay.io/jetstack/cert-manager-acmesolver
    tag: v1.17.1

  - name: cert-manager-startupapicheck
    source: quay.io/jetstack/cert-manager-startupapicheck
    tag: v1.17.1

  # ── Cilium (1.17.1) ───────────────────────────────────────────────────────

  - name: cilium
    source: quay.io/cilium/cilium
    tag: v1.17.1

  - name: cilium-operator-generic
    source: quay.io/cilium/operator-generic
    tag: v1.17.1

  - name: cilium-hubble-relay
    source: quay.io/cilium/hubble-relay
    tag: v1.17.1

  - name: cilium-hubble-ui
    source: quay.io/cilium/hubble-ui
    tag: v1.17.1

  - name: cilium-hubble-ui-backend
    source: quay.io/cilium/hubble-ui-backend
    tag: v1.17.1

  # ── Fluent Bit (4.0.3) ────────────────────────────────────────────────────

  - name: fluent-bit
    source: cr.fluentbit.io/fluent/fluent-bit
    tag: "4.0.3"

  - name: configmap-reload
    source: ghcr.io/jimmidyson/configmap-reload
    tag: v0.14.0

  # ── kube-prometheus-stack (operator v0.83.0) ──────────────────────────────

  - name: prometheus-operator
    source: quay.io/prometheus-operator/prometheus-operator
    tag: v0.83.0

  - name: prometheus-config-reloader
    source: quay.io/prometheus-operator/prometheus-config-reloader
    tag: v0.83.0

  - name: prometheus-operator-admission-webhook
    source: quay.io/prometheus-operator/admission-webhook
    tag: v0.83.0

  - name: prometheus
    source: quay.io/prometheus/prometheus
    tag: v3.4.1

  - name: alertmanager
    source: quay.io/prometheus/alertmanager
    tag: v0.28.1

  - name: thanos
    source: quay.io/thanos/thanos
    tag: v0.38.0

  - name: kube-webhook-certgen
    source: registry.k8s.io/ingress-nginx/kube-webhook-certgen
    tag: v1.5.4

  # ── Grafana (12.0.2) ──────────────────────────────────────────────────────

  - name: grafana
    source: docker.io/grafana/grafana
    tag: "12.0.2"

  - name: grafana-image-renderer
    source: docker.io/grafana/grafana-image-renderer
