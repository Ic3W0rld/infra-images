    tag: "0.126.0"

  # ── PostgreSQL / Bitnami ──────────────────────────────────────────────────

  - name: bitnami-postgresql
    source: registry-1.docker.io/bitnami/postgresql
    tag: latest
    resolve_latest: true

  - name: bitnami-postgres-exporter
    source: registry-1.docker.io/bitnami/postgres-exporter
