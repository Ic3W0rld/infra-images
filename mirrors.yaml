  - name: kube-rbac-proxy
    source: quay.io/brancz/kube-rbac-proxy
    tag: v0.19.1

  # ── MetalLB (v0.14.9) ─────────────────────────────────────────────────────

  - name: metallb-controller
    source: quay.io/metallb/controller
    tag: v0.14.9

  - name: metallb-speaker
    source: quay.io/metallb/speaker
    tag: v0.14.9

  - name: frrouting-frr
